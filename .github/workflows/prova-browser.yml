name: Prova del sito nel browser
on:
  workflow_dispatch:
  push:
    paths: ["pipeline/test/avvia.txt"]
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      # se i mirror Ubuntu non rispondono, Chromium senza pacchetti di sistema (sul runner ci sono quasi tutti)
      - run: pip install -q playwright && (python -m playwright install --with-deps chromium || python -m playwright install chromium)
      - run: python pipeline/test/prova_browser.py
      - if: always()
        run: |
          git config user.name "campi-aperti-bot"; git config user.email "actions@users.noreply.github.com"
          git add -f prove && git commit -m "Prova nel browser" && git pull --rebase && git push || true
