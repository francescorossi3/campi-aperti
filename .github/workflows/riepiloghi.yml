name: Meteo e riepiloghi regionali

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"      # ogni giorno: completa/aggiorna il meteo e i riepiloghi
  push:
    paths: ["pipeline/avvia_riepiloghi.txt"]

permissions:
  contents: write

jobs:
  riepiloghi:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATA_REPO: Bradipo92/campi-aperti-data
    steps:
      - uses: actions/checkout@v4
      - name: Python
        run: pip install -q requests pandas pyarrow huggingface_hub
      - name: scarica blocchi e cache meteo
        run: cd pipeline && ln -s ../data data 2>/dev/null; mkdir -p ../data && MODO=giu CARTELLE=blocchi,meteo python hf_sync.py
      - name: 04 meteo per cella
        run: cd pipeline && python 04_meteo_celle.py
      - name: salva la cache meteo
        run: cd pipeline && MODO=su CARTELLE=meteo python hf_sync.py
      - name: 05 bilancio per regione e coltura
        run: cd pipeline && python 05_bilancio_regioni.py
      - name: pubblica data/riepiloghi.json sul sito
        run: |
          git config user.name "campi-aperti-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/riepiloghi.json
          git diff --cached --quiet || (git commit -m "Aggiorna riepiloghi regionali" && git push)
