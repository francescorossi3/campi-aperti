name: Prova Delineate Anything
on:
  workflow_dispatch:
  push:
    paths: ["pipeline/prova_delineate.py"]
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision ultralytics onnxruntime huggingface_hub pillow requests
      - run: cd pipeline && python prova_delineate.py
      - run: |
          git config user.name "campi-aperti-bot"; git config user.email "actions@users.noreply.github.com"
          mkdir -p prove && cp pipeline/prove/* prove/
          git add -f prove && git commit -m "Immagini di prova Delineate Anything" && git pull --rebase && git push
