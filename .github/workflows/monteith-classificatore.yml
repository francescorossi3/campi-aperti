name: Rese per provincia con il classificatore delle colture (Monteith vs ISTAT)

# I campi di ogni coltura sono individuati dal classificatore delle colture (script 20) invece che dalla mappa
# Copernicus; poi modello di Monteith e confronto con ISTAT (script 12, FONTE=classificatore).
# Automatico ogni mese: tutte le annate × l'Italia divisa in 4 parti (circa 2 ore per parte, 8 lavori alla volta).
# A mano: un'annata (o tutte) e, se si vuole, solo alcune province.

on:
  workflow_dispatch:
    inputs:
      anno:
        description: "Annata (anno di fine, es. 2024 = 2023/24); vuoto = tutte dal 2018"
        default: ""
      province:
        description: "Sigle delle province separate da virgole (es. RM,LT); vuoto = tutta Italia in 4 parti"
        default: ""
  schedule:
    - cron: "23 1 3 * *"

permissions:
  contents: write

jobs:
  piano:
    runs-on: ubuntu-24.04
    outputs:
      matrice: ${{ steps.m.outputs.matrice }}
    steps:
      - id: m
        env:
          ANNO: ${{ inputs.anno }}
          PROVINCE: ${{ inputs.province }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          anni = [int(os.environ["ANNO"])] if os.environ.get("ANNO") else list(range(2018, 2026))
          parti = [""] if os.environ.get("PROVINCE") else ["1/4", "2/4", "3/4", "4/4"]
          print("matrice=" + json.dumps({"include": [{"anno": a, "parte": p} for a in anni for p in parti]}))
          PY

  classifica:
    needs: piano
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.piano.outputs.matrice) }}
    env:
      ANNO: ${{ matrix.anno }}
      PARTE: ${{ matrix.parte }}
      PROVINCE: ${{ inputs.province }}
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q requests pandas pyarrow numpy rasterio geopandas pyproj
      - name: 20 classificatore e NDVI per provincia
        run: cd pipeline && ln -s ../data data 2>/dev/null; mkdir -p ../data && python -u 20_ndvi_province_classificatore.py
      - uses: actions/upload-artifact@v4
        with:
          name: cls-${{ matrix.anno }}-${{ strategy.job-index }}
          path: data/province_ndvi_cls/*.parquet

  confronto:
    needs: classifica
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATA_REPO: Bradipo92/campi-aperti-data
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q requests pandas pyarrow numpy geopandas huggingface_hub
      - name: scarica i calcoli precedenti e la cache della radiazione
        run: cd pipeline && ln -s ../data data 2>/dev/null; mkdir -p ../data && MODO=giu CARTELLE=province_ndvi_cls,province_ndvi python hf_sync.py || true
      - uses: actions/download-artifact@v4
        with:
          pattern: cls-*
          path: data/province_ndvi_cls
          merge-multiple: true
      - name: 12 modello Monteith e confronto ISTAT
        run: cd pipeline && FONTE=classificatore python -u 12_monteith_province.py
      - name: carica su Hugging Face
        run: cd pipeline && MODO=su CARTELLE=province_ndvi_cls python hf_sync.py
      - name: pubblica
        run: |
          git config user.name "campi-aperti-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/monteith_province_cls.json
          git diff --cached --quiet || (git commit -m "Aggiorna rese Monteith / ISTAT con il classificatore delle colture" && git pull --rebase && git push)
