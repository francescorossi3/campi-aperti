name: Sonda CLMS
on:
  workflow_dispatch:
  push:
    paths: ["pipeline/test/sonda_clms.py"]
jobs:
  sonda:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
      CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q requests && python pipeline/test/sonda_clms.py
