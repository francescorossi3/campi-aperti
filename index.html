<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://gc.zgo.at 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' blob: data: https://*.supabase.co wss://*.supabase.co https://huggingface.co https://*.huggingface.co https://*.hf.co https://planetarycomputer.microsoft.com https://*.blob.core.windows.net https://image.discomap.eea.europa.eu https://api.open-meteo.com https://archive-api.open-meteo.com https://rest.isric.org https://nominatim.openstreetmap.org https://photon.komoot.io https://epsg.io https://cdn.jsdelivr.net https://bradipored3.goatcounter.com https://phenology.vgt.vito.be https://wms.cartografia.agenziaentrate.gov.it; worker-src 'self' blob: https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Columella — open data for agriculture</title>
  <meta name="description" content="Mappa gratuita di dati aperti per l'agricoltura italiana: catasto, Copernicus Land Monitoring Service, meteo. Free open-data map for Italian agriculture.">
  <link rel="stylesheet" href="js/vendor/leaflet/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Source+Sans+3:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=33">
</head>
<body>
  <header class="topbar">
    <button id="toggleSidebar" class="icon-btn" aria-label="Menu">☰</button>
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="26" height="26"><rect x="2" y="2" width="28" height="28" rx="6" fill="#2f5d3a"/><path d="M7 22h18M7 17h18M7 12h18" stroke="#e8d9a8" stroke-width="2"/><circle cx="22" cy="9" r="3" fill="#e8b84a"/></svg>
      </span>
      <div>
        <h1 data-i18n="title">Columella</h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
    </div>
    <form id="searchForm" class="search" autocomplete="off">
      <input id="searchInput" type="search" data-i18n-ph="search_ph">
      <ul id="searchResults" class="search-results" hidden></ul>
    </form>
    <div class="lang" role="group" aria-label="Lingua / Language">
      <button data-lang="it">IT</button><button data-lang="en">EN</button>
    </div>
    <div class="account-wrap">
      <button id="accountBtn" class="account-btn" aria-haspopup="true" aria-expanded="false">👤</button>
      <div id="accountBox" class="account-pop" hidden></div>
    </div>
  </header>

  <main class="layout">
    <aside id="sidebar" class="sidebar" aria-label="Pannello">
      <button id="sheetHandle" class="sheet-handle" type="button" aria-label="Pannello / Panel"><span></span></button>
      <nav class="tabs" role="tablist">
        <button role="tab" class="tab active" data-tab="maps" data-i18n="tab_maps"></button>
        <button role="tab" class="tab" data-tab="fields" data-i18n="tab_fields"></button>
        <button role="tab" class="tab" data-tab="provinces" data-i18n="tab_provinces"></button>
        <button role="tab" class="tab" data-tab="regions" data-i18n="tab_regions"></button>
      </nav>
      <div class="sb-scroll">
        <!-- tab Mappe -->
        <div class="tab-panel active" id="tab-maps" role="tabpanel">
          <details class="sec" id="sec-basemap" open>
            <summary><span class="sec-t" data-i18n="basemap"></span></summary>
            <div class="sec-body">
              <div id="basemaps" class="basemaps"></div>
              <button type="button" class="small-btn" id="openLayerWin" data-i18n="lw_open"></button>
            </div>
          </details>
          <div id="layerList"></div>
          <details class="sec" id="sec-community">
            <summary><span class="sec-t" data-i18n="sec_community"></span></summary>
            <div class="sec-body"><div id="communityBox"></div></div>
          </details>
          <details class="sec sec-minor" id="sec-data">
            <summary><span class="sec-t" data-i18n="tab_data"></span></summary>
            <div class="sec-body"><p class="hint" data-i18n="data_intro"></p><div id="catalog"></div></div>
          </details>
          <details class="sec sec-minor" id="sec-about">
            <summary><span class="sec-t" data-i18n="tab_about"></span></summary>
            <div class="sec-body"><div id="about"></div><p class="credits" data-i18n="credits"></p></div>
          </details>
        </div>

        <!-- tab Campi -->
        <div class="tab-panel" id="tab-fields" role="tabpanel" hidden>
          <details class="sec" id="sec-fields" open>
            <summary><span class="sec-t" data-i18n="sec_fields"></span><span class="sec-s" id="sum-fields"></span></summary>
            <div class="sec-body">
              <p class="hint" data-i18n="fields_hint"></p>
              <div class="detect-row">
                <button type="button" class="btn-primary" id="detectView" data-i18n="det_view"></button>
                <button type="button" class="small-btn" id="detectDraw" data-i18n="det_draw"></button>
              </div>
              <div id="toolBar" class="tool-row"></div>
              <div id="drawHint" class="draw-hint" role="status" hidden></div>
              <div id="toolCards"></div>
            </div>
          </details>
          <details class="sec" id="sec-selected" open>
            <summary><span class="sec-t" data-i18n="sec_selected"></span><span class="sec-s" id="sum-selected"></span></summary>
            <div class="sec-body">
              <div id="fieldChips" class="field-chips"></div>
              <label class="chk add-mode"><input type="checkbox" id="addMode"> <span data-i18n="add_mode"></span></label>
              <p class="hint small" data-i18n="multi_hint"></p>
            </div>
          </details>
          <details class="sec" id="sec-series">
            <summary><span class="sec-t" data-i18n="sec_series"></span><span class="sec-s" id="sum-series"></span></summary>
            <div class="sec-body">
              <section id="fieldMapBox" class="field-layer-box" hidden></section>
              <section id="fieldPanel" class="field-panel" hidden></section>
              <p class="hint empty-field" data-i18n="series_empty"></p>
            </div>
          </details>
          <details class="sec" id="sec-compare">
            <summary><span class="sec-t" data-i18n="sec_compare"></span></summary>
            <div class="sec-body"><div id="compareBox"><p class="hint" data-i18n="compare_empty"></p></div></div>
          </details>
          <details class="sec" id="sec-services">
            <summary><span class="sec-t" data-i18n="sec_services"></span><span class="sec-s" id="sum-services"></span></summary>
            <div class="sec-body">
              <div id="servicesBox"></div>
              <p class="hint empty-field" data-i18n="services_empty"></p>
            </div>
          </details>
        </div>

        <!-- tab Province e Regioni -->
        <div class="tab-panel" id="tab-provinces" role="tabpanel" hidden><div class="sec-body"><div id="provPanel"></div></div></div>
        <div class="tab-panel" id="tab-regions" role="tabpanel" hidden><div class="sec-body"><div id="regionsPanel"></div></div></div>
      </div>
    </aside>

    <div class="map-wrap">
      <div id="map" class="map"></div>
    </div>
  </main>

  <script src="js/vendor/leaflet/leaflet.js"></script>
  <script src="js/vendor/chart.umd.min.js"></script>
  <script src="js/vendor/geotiff.js"></script>
  <script src="js/vendor/proj4.js"></script>
  <script src="js/config.js?v=33"></script>
  <script src="js/i18n.js?v=33"></script>
  <script src="js/croplayer.js?v=33"></script>
  <script src="js/mapstyle.js?v=33"></script>
  <script src="js/clip.js?v=33"></script>
  <script src="js/layers.js?v=33"></script>
  <script src="js/segment.js?v=33"></script>
  <script src="js/delineate.js?v=33"></script>
  <script src="js/live.js?v=33"></script>
  <script src="js/advice.js?v=33"></script>
  <script src="js/regions.js?v=33"></script>
  <script src="js/account.js?v=33"></script>
  <script src="js/tools.js?v=33"></script>
  <script src="js/app.js?v=33"></script>
<!-- statistiche d'uso anonime, senza cookie (GoatCounter) -> repository privato Census -->
<script data-goatcounter="https://bradipored3.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
